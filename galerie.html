  <script>
    // Příchod ponořením z kelímku: stránka začne zalitá jogurtem (ještě před prvním vykreslením).
    try {
      const ponor = JSON.parse(sessionStorage.getItem('jogurti-ponor'));
      if (ponor) {
        document.documentElement.classList.add('vstup');
        document.documentElement.style.setProperty('--vstup-barva', ponor.barva);
        document.documentElement.style.background = ponor.barva;   // žádné bílé bliknutí při načítání
      }
    } catch (e) {}
  </script>

        "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.mjs"

  </script>
